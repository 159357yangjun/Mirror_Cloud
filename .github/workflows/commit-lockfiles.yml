name: Commit Dependency Locks

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  commit-locks:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - name: Generate dependency locks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo generate-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'cargo generate-lockfile failed' }
          Push-Location apps/desktop
          npm install --package-lock-only --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'desktop package-lock generation failed' }
          Pop-Location
          Push-Location website
          npm install --package-lock-only --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'website package-lock generation failed' }
          Pop-Location

      - name: Validate generated locks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo check --workspace --locked
          if ($LASTEXITCODE -ne 0) { throw 'cargo check --locked failed' }
          Push-Location apps/desktop
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'desktop npm ci failed' }
          Pop-Location
          Push-Location website
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'website npm ci failed' }
          Pop-Location

      - name: Commit lockfiles to dev
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git add Cargo.lock apps/desktop/package-lock.json website/package-lock.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Dependency lockfiles are already committed.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: commit resolved dependency locks'
          if ($LASTEXITCODE -ne 0) { throw 'git commit failed' }
          git pull --rebase origin dev
          if ($LASTEXITCODE -ne 0) { throw 'git pull --rebase failed' }
          git push origin HEAD:dev
          if ($LASTEXITCODE -ne 0) { throw 'git push failed' }
