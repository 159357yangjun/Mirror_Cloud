name: One-time Cloud Asset Index Wire

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/remote-index-wire.yml'

permissions:
  contents: write

jobs:
  wire-validate-and-push:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply guarded cloud-index wiring
        run: python scripts/wire_remote_index.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Validate contracts and user flow
        run: |
          python scripts/validate.py
          python scripts/check_contracts.py
          python scripts/check_user_flow.py
      - name: Generate Rust lock and check workspace
        run: |
          cargo generate-lockfile
          cargo check --workspace --locked
      - name: Build desktop frontend
        working-directory: apps/desktop
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run build
      - name: Confirm remote did not advance and commit
        shell: bash
        run: |
          git fetch origin dev
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/dev)" ]; then
            echo 'dev advanced during validation; refusing to overwrite concurrent work.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/src-tauri/src/commands.rs apps/desktop/src-tauri/src/commands/remote_index.rs apps/desktop/src-tauri/src/lib.rs apps/desktop/src/lib/desktop.ts apps/desktop/src/pages/AssetsPage.tsx apps/desktop/src/components/CloudIndexSyncBanner.tsx
          if git diff --cached --quiet; then
            echo 'No cloud index wiring changes to commit.'
            exit 0
          fi
          git commit -m 'feat: sync existing cloud images into asset index'
          git push origin HEAD:dev
