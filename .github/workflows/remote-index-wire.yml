name: One-time Cloud Asset Index Wire

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/remote-index-wire.yml'

permissions:
  contents: write

jobs:
  wire-validate-and-push:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply guarded cloud-index wiring
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          commands_path = Path('apps/desktop/src-tauri/src/commands.rs')
          commands = commands_path.read_text(encoding='utf-8')
          commands = replace_once(
              commands,
              'pub(crate) mod integrations;\npub(crate) mod plugins;\npub(crate) mod storage_entries;\npub use plugins::*;\npub use storage_entries::*;\n',
              'pub(crate) mod integrations;\npub(crate) mod plugins;\npub(crate) mod remote_index;\npub(crate) mod storage_entries;\npub use plugins::*;\npub use remote_index::*;\npub use storage_entries::*;\n',
              'commands remote_index module wiring',
          )
          commands_path.write_text(commands, encoding='utf-8', newline='\n')

          lib_path = Path('apps/desktop/src-tauri/src/lib.rs')
          lib = lib_path.read_text(encoding='utf-8')
          lib = replace_once(
              lib,
              '            commands::browse_storage,\n',
              '            commands::browse_storage,\n            commands::sync_storage_asset_index,\n',
              'Tauri sync handler',
          )
          lib_path.write_text(lib, encoding='utf-8', newline='\n')

          desktop_path = Path('apps/desktop/src/lib/desktop.ts')
          desktop = desktop_path.read_text(encoding='utf-8')
          desktop = replace_once(
              desktop,
              "\n\nconst docsBaseUrl = (import.meta.env.VITE_DOCS_BASE_URL || '').trim().replace(/\\/+$/, '')\n",
              "\n\nexport interface RemoteIndexSyncResult {\n  storagesScanned: number\n  filesScanned: number\n  imported: number\n  skippedExisting: number\n  skippedNonImages: number\n  errors: string[]\n}\n\nconst docsBaseUrl = (import.meta.env.VITE_DOCS_BASE_URL || '').trim().replace(/\\/+$/, '')\n",
              'desktop remote index result type',
          )
          desktop = replace_once(
              desktop,
              "export async function browseStorage(storageId: string, path: string): Promise<StorageEntryView[]> {\n  return invoke('browse_storage', { storageId, path })\n}\n",
              "export async function browseStorage(storageId: string, path: string): Promise<StorageEntryView[]> {\n  return invoke('browse_storage', { storageId, path })\n}\n\nexport async function syncStorageAssetIndex(storageId?: string): Promise<RemoteIndexSyncResult> {\n  return invoke('sync_storage_asset_index', { storageId: storageId || null })\n}\n",
              'desktop sync invocation',
          )
          desktop_path.write_text(desktop, encoding='utf-8', newline='\n')

          banner_path = Path('apps/desktop/src/components/CloudIndexSyncBanner.tsx')
          if banner_path.exists():
              raise SystemExit('CloudIndexSyncBanner already exists; refusing to overwrite concurrent work')
          banner_path.write_text("""import { AlertTriangle, CheckCircle2, Images, RefreshCw } from 'lucide-react'
          import { useMutation, useQuery, useQueryClient } from '@tanstack/react-query'
          import { useState } from 'react'
          import { listStorages, syncStorageAssetIndex } from '../lib/desktop'

          interface CloudIndexSyncBannerProps {
            onOpenGallery: () => void
          }

          export function CloudIndexSyncBanner({ onOpenGallery }: CloudIndexSyncBannerProps) {
            const queryClient = useQueryClient()
            const { data: storages = [] } = useQuery({ queryKey: ['storages'], queryFn: listStorages })
            const [message, setMessage] = useState<string | null>(null)
            const [hasWarning, setHasWarning] = useState(false)
            const enabledCount = storages.filter((storage) => storage.enabled).length

            const syncMutation = useMutation({
              mutationFn: () => syncStorageAssetIndex(),
              onMutate: () => {
                setMessage(null)
                setHasWarning(false)
              },
              onSuccess: async (summary) => {
                await queryClient.invalidateQueries({ queryKey: ['assets'] })
                setHasWarning(summary.errors.length > 0)
                setMessage(
                  `扫描 ${summary.storagesScanned} 个云端、${summary.filesScanned} 个文件；新增 ${summary.imported} 张图片，已有 ${summary.skippedExisting} 张，跳过非图片 ${summary.skippedNonImages} 个${summary.errors.length ? `；${summary.errors.length} 项需要注意` : ''}。`,
                )
              },
              onError: (error) => {
                setHasWarning(true)
                setMessage(`同步失败：${String(error)}`)
              },
            })

            return (
              <div className="mt-6 rounded-2xl border border-blue-100 bg-blue-50/60 px-4 py-3 text-xs leading-6 text-blue-800">
                <div className="flex flex-wrap items-center gap-3">
                  <Images size={16} className="shrink-0" />
                  <div className="min-w-[280px] flex-1">
                    <span className="font-semibold">资源索引可以同步已有云端图片。</span> 以前已经存在于 GitHub / Gitee / R2 / OSS / COS / WebDAV 的图片，可以加入资源页统一复制与管理；只记录元数据、公开 URL 和云端路径，不下载图片本体。
                  </div>
                  <button onClick={onOpenGallery} className="shrink-0 rounded-lg bg-white px-3 py-1.5 font-medium text-blue-700 shadow-sm">查看图库</button>
                  <button
                    disabled={!enabledCount || syncMutation.isPending}
                    onClick={() => syncMutation.mutate()}
                    className="inline-flex shrink-0 items-center gap-1.5 rounded-lg bg-blue-700 px-3 py-1.5 font-medium text-white disabled:opacity-40"
                    title={enabledCount ? `同步 ${enabledCount} 个已启用云端` : '请先连接并启用云端'}
                  >
                    <RefreshCw size={13} className={syncMutation.isPending ? 'animate-spin' : ''} />
                    {syncMutation.isPending ? '同步中…' : '同步云端索引'}
                  </button>
                </div>
                <div className="mt-1 pl-7 text-[11px] text-blue-700/70">为避免首次同步过载，每个云端单次最多扫描 2000 个文件；重复同步会跳过已经索引的同一云端路径。</div>
                {message && (
                  <div className={`mt-2 flex items-start gap-2 rounded-xl px-3 py-2 ${hasWarning ? 'bg-amber-50 text-amber-800' : 'bg-emerald-50 text-emerald-700'}`}>
                    {hasWarning ? <AlertTriangle size={14} className="mt-1 shrink-0" /> : <CheckCircle2 size={14} className="mt-1 shrink-0" />}
                    <span>{message}</span>
                  </div>
                )}
              </div>
            )
          }
          """.replace('          ', ''), encoding='utf-8', newline='\n')

          assets_path = Path('apps/desktop/src/pages/AssetsPage.tsx')
          assets = assets_path.read_text(encoding='utf-8')
          assets = replace_once(
              assets,
              "import { PageHeader } from '../components/PageHeader'\n",
              "import { PageHeader } from '../components/PageHeader'\nimport { CloudIndexSyncBanner } from '../components/CloudIndexSyncBanner'\n",
              'Assets cloud sync banner import',
          )
          pattern = re.compile(
              r'      <div className="mt-6 flex items-start gap-3 rounded-2xl border border-blue-100 bg-blue-50/60 px-4 py-3 text-xs leading-6 text-blue-800">\n.*?\n      </div>\n\n      <div className="mt-6 flex items-center gap-3">',
              re.S,
          )
          replacement = """      <CloudIndexSyncBanner onOpenGallery={() => setPage('gallery')} />

      <div className=\"mt-6 flex items-center gap-3\">"""
          assets, count = pattern.subn(replacement, assets, count=1)
          if count != 1:
              raise SystemExit(f'Assets info banner expected once, got {count}')
          assets_path.write_text(assets, encoding='utf-8', newline='\n')
          '@ | python -
      - name: Format Rust
        run: cargo fmt --all
      - name: Validate contracts and user flow
        run: |
          python scripts/validate.py
          python scripts/check_contracts.py
          python scripts/check_user_flow.py
      - name: Generate Rust lock and check workspace
        run: |
          cargo generate-lockfile
          cargo check --workspace --locked
      - name: Build desktop frontend
        working-directory: apps/desktop
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run build
      - name: Confirm remote did not advance and commit
        shell: bash
        run: |
          git fetch origin dev
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/dev)" ]; then
            echo 'dev advanced during validation; refusing to overwrite concurrent work.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/src-tauri/src/commands.rs apps/desktop/src-tauri/src/commands/remote_index.rs apps/desktop/src-tauri/src/lib.rs apps/desktop/src/lib/desktop.ts apps/desktop/src/pages/AssetsPage.tsx apps/desktop/src/components/CloudIndexSyncBanner.tsx
          if git diff --cached --quiet; then
            echo 'No cloud index wiring changes to commit.'
            exit 0
          fi
          git commit -m 'feat: sync existing cloud images into asset index'
          git push origin HEAD:dev
