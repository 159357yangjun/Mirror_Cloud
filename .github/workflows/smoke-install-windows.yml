name: Smoke Windows Installers

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/smoke-install-windows.yml'
      - 'scripts/smoke_windows_installers.ps1'

permissions:
  contents: read

jobs:
  smoke-installers:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-03
        with:
          toolchain: '1.98.1'

      - name: Validate release guards
        run: |
          python scripts/check_workflow_action_pins.py
          python scripts/check_release_version.py
          python scripts/check_tauri_dependency_family.py

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build Windows bundles
        working-directory: apps/desktop
        run: npm run tauri build

      - name: Verify build kept dependency locks immutable
        shell: pwsh
        run: |
          git diff --exit-code -- Cargo.lock apps/desktop/package-lock.json website/package-lock.json
          if ($LASTEXITCODE -ne 0) { throw 'Bundle build modified committed dependency locks.' }

      - name: Smoke-test NSIS and MSI installers
        shell: pwsh
        run: ./scripts/smoke_windows_installers.ps1

      - name: Upload installer smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer-smoke-logs
          path: ${{ runner.temp }}/image-hosting-platform-installer-smoke/**
          if-no-files-found: ignore
          retention-days: 14
