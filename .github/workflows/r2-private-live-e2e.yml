# Privileged real-cloud test; NOT a push / pull_request workflow.
# Owner must configure the protected r2-private-e2e Environment BEFORE use:
# mandatory reviewers, deployment branch rules, scoped R2 credentials and CF API token.
name: R2 Private Live E2E

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RUN_DISPOSABLE_R2_E2E to authorize one test-object write'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: r2-private-live-e2e
  cancel-in-progress: false

jobs:
  live-r2:
    # The environment still MUST restrict branches and require human approval.
    # Never grant the cloud secrets to an untrusted PR/ref.
    if: ${{ github.repository == '159357yangjun/Mirror_Cloud' && github.event_name == 'workflow_dispatch' && inputs.confirmation == 'RUN_DISPOSABLE_R2_E2E' && (github.ref == 'refs/heads/feature/r2-private-publish-v1' || github.ref == 'refs/heads/main') }}
    runs-on: windows-latest
    timeout-minutes: 55
    environment:
      name: r2-private-e2e
    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-03
        with:
          toolchain: '1.98.1'

      - name: Verify exactly one production OpenDAL live test exists
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'commands::r2_private_live_e2e::real_r2_private_object_e2e'
          $listing = & cargo test --locked -p image-hosting-platform-desktop --lib $name -- --list 2>&1
          if ($LASTEXITCODE -ne 0 -or -not (($listing -join "`n").Contains("$name: test"))) {
            throw 'Exact production OpenDAL live test is missing or cannot compile; secrets not loaded.'
          }
          Write-Host 'PASS: exact production OpenDAL R2 integration test compiled and discovered.'

      - name: Real R2 private object E2E (approved test bucket only)
        id: live
        shell: pwsh
        env:
          R2_E2E_ACCOUNT_ID: ${{ vars.R2_E2E_ACCOUNT_ID }}
          R2_E2E_BUCKET: ${{ vars.R2_E2E_BUCKET }}
          R2_E2E_ACCESS_KEY_ID: ${{ secrets.R2_E2E_ACCESS_KEY_ID }}
          R2_E2E_SECRET_ACCESS_KEY: ${{ secrets.R2_E2E_SECRET_ACCESS_KEY }}
          R2_E2E_CLOUDFLARE_API_TOKEN: ${{ secrets.R2_E2E_CLOUDFLARE_API_TOKEN }}
          R2_E2E_ALLOW_TEST_WRITES: YES_TEST_BUCKET
        run: |
          $ErrorActionPreference = 'Stop'
          $report = Join-Path $env:RUNNER_TEMP 'r2-private-e2e-sanitized.txt'
          $head = @(
            'R2 private object E2E - sanitized execution evidence',
            "commit: $env:GITHUB_SHA",
            "run: $env:GITHUB_RUN_ID",
            'scope: R2 managed/custom domains and S3 API endpoint (not Workers/proxies)'
          )
          # Create a report even for missing credentials. It must never include a URL or secret.
          if (@('R2_E2E_ACCOUNT_ID','R2_E2E_BUCKET','R2_E2E_ACCESS_KEY_ID','R2_E2E_SECRET_ACCESS_KEY','R2_E2E_CLOUDFLARE_API_TOKEN') |
              Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }) {
            $head + 'status: BLOCKED - protected environment variables/secrets not configured' |
              Set-Content -LiteralPath $report -Encoding utf8
            Get-Content -LiteralPath $report | Add-Content -Path $env:GITHUB_STEP_SUMMARY
            throw 'Missing protected R2 test configuration. No cloud request was started.'
          }
          $name = 'commands::r2_private_live_e2e::real_r2_private_object_e2e'
          # NEVER echo the unfiltered Cargo/test output; a provider error could contain a bearer URL.
          # Read it only in runner memory, and emit allowlisted stage verdicts below.
          $output = & cargo test --locked -p image-hosting-platform-desktop --lib $name -- --ignored --exact --nocapture 2>&1
          $exitCode = $LASTEXITCODE
          $combined = $output -join "`n"
          $stages = [ordered]@{
            'pre-write domain audit' = 'PASS domain-audit:'
            'OpenDAL upload and authorized readback' = 'PASS upload:'
            'unsigned R2 GET denied' = 'PASS unsigned-read:'
            'presigned GET HTTP 200 and SHA256' = 'PASS presigned-read:'
            'original signed GET expired' = 'PASS expiry:'
            'remote test object deleted' = 'PASS cleanup:'
            'whole production test completed' = 'PASS LIVE R2 E2E:'
          }
          $lines = @($head)
          $allStagesPassed = $true
          foreach ($label in $stages.Keys) {
            $ok = $combined.Contains($stages[$label])
            if (-not $ok) { $allStagesPassed = $false }
            $verdict = if ($ok) { 'PASS' } else { 'UNVERIFIED' }
            $lines += "$label : $verdict"
          }
          # Rust's test harness returns success even for a typo matching zero tests.
          $exactOnePassed = $combined -match 'test result: ok\. 1 passed; 0 failed;'
          $pass = $exitCode -eq 0 -and $exactOnePassed -and $allStagesPassed
          $lines += "test harness ran exactly one successful test: $exactOnePassed"
          $lines += if ($pass) { 'status: PASS' } else { 'status: FAIL / UNVERIFIED' }
          $lines | Set-Content -LiteralPath $report -Encoding utf8
          $lines | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          if (-not $pass) {
            throw 'R2 live E2E failed or was incomplete. Only sanitized stage verdicts are published.'
          }

      - name: Upload sanitized E2E evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r2-private-e2e-sanitized
          path: ${{ runner.temp }}/r2-private-e2e-sanitized.txt
          if-no-files-found: ignore
          retention-days: 7
