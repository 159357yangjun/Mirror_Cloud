name: Upgrade Docs Security

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/upgrade-docs-security.yml'

permissions:
  contents: write

jobs:
  upgrade-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Upgrade Astro and Starlight together
        shell: pwsh
        working-directory: website
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $package.dependencies.astro = '7.3.5'
          $package.dependencies.'@astrojs/starlight' = '0.42.4'
          $package | ConvertTo-Json -Depth 32 | Set-Content -Encoding utf8 package.json
          Remove-Item package-lock.json -Force
          npm install --package-lock-only --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Astro/Starlight lock regeneration failed' }

      - name: Validate upgraded docs
        shell: pwsh
        working-directory: website
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'docs build failed' }
          npm audit --audit-level=high
          if ($LASTEXITCODE -ne 0) { throw 'npm audit still reports high/critical findings' }

      - name: Commit verified docs security upgrade
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git add website/package.json website/package-lock.json
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff check failed' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: upgrade docs to secure Astro 7 baseline'
          if ($LASTEXITCODE -ne 0) { throw 'git commit failed' }
          git pull --rebase origin dev
          if ($LASTEXITCODE -ne 0) { throw 'git pull --rebase failed; reconcile concurrent changes' }
          git push origin HEAD:dev
          if ($LASTEXITCODE -ne 0) { throw 'git push failed' }
