name: One-time Rustfmt Fix

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/rustfmt-fix.yml'

permissions:
  contents: write

jobs:
  format-and-push:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        shell: pwsh
        run: cargo fmt --all
      - name: Commit formatting only if needed
        shell: pwsh
        run: |
          if (-not (git status --porcelain -- '*.rs')) {
            Write-Host 'Rust files are already formatted.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.rs'
          git commit -m 'style: apply rustfmt from cloud CI'
          git push origin HEAD:dev
