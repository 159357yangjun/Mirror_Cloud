name: One-time Gallery Card Wire

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/gallery-card-wire.yml'

permissions:
  contents: write

jobs:
  wire-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wire modern gallery card with guarded patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('apps/desktop/src/pages/GalleryPage.tsx')
          source = path.read_text(encoding='utf-8')

          old_import = "import { PageHeader } from '../components/PageHeader'\n"
          if source.count(old_import) != 1:
              raise SystemExit(f'Gallery PageHeader import expected once, got {source.count(old_import)}')
          source = source.replace(
              old_import,
              old_import + "import { GalleryMediaCard } from '../components/GalleryMediaCard'\n",
              1,
          )

          pattern = re.compile(
              r"            \{!isLoading && !error && view === 'grid' && filtered\.length > 0 && \(\n.*?\n            \)\}\n\n            \{!isLoading && !error && view === 'list'",
              re.S,
          )
          replacement = """            {!isLoading && !error && view === 'grid' && filtered.length > 0 && (
              <div className=\"grid grid-cols-[repeat(auto-fill,minmax(220px,1fr))] gap-5\">
                {filtered.map((entry) => (
                  <GalleryMediaCard
                    key={entry.path}
                    entry={entry}
                    selected={selectedPaths.has(entry.path)}
                    copied={copied === entry.path}
                    busy={busyPath === entry.path}
                    operationBusy={operationBusy}
                    onSelect={() => toggleSelected(entry)}
                    onOpen={() => {
                      if (entry.isDir) setPath(entry.path)
                      else if (isImage(entry) && entry.publicUrl) setPreview(entry)
                    }}
                    onCopy={() => void copyUrl(entry)}
                    onOpenExternal={() => entry.publicUrl && void openExternalUrl(entry.publicUrl)}
                    onRename={() => setPathDialog({ mode: 'rename', entry, value: entry.name })}
                    onMove={() => setPathDialog({ mode: 'move', entry, value: parentPath(entry.path) })}
                    onDownload={() => void downloadEntry(entry)}
                    onDelete={() => void deleteEntry(entry)}
                  />
                ))}
              </div>
            )}

            {!isLoading && !error && view === 'list'"""
          source, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'Gallery grid block expected once, got {count}')

          path.write_text(source, encoding='utf-8', newline='\n')
          PY
      - name: Build desktop frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
      - name: Commit Gallery wiring only after build passes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/src/pages/GalleryPage.tsx
          if git diff --cached --quiet; then
            echo 'No Gallery wiring changes to commit.'
            exit 0
          fi
          git commit -m 'feat: use wallpaper-style cards in cloud gallery'
          git push origin HEAD:dev
