name: UX Upgrade Compatibility (isolated)

on:
  push:
    branches:
      - ci/ux-upgrade-compat-20261011

permissions:
  contents: read
  actions: read

jobs:
  windows-upgrade:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse product-source changes and privilege escalations
        shell: pwsh
        run: |
          $source = '0f7ac930860c46c3553f76d83429aae842fa35a9'
          if ($env:GITHUB_REF -ne 'refs/heads/ci/ux-upgrade-compat-20261011') { throw 'Wrong branch' }
          git merge-base --is-ancestor $source HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Branch is not based on the accepted #33 source' }
          $changed = @(git diff --name-only $source HEAD)
          $allowed = @('.github/workflows/ux-upgrade-compat.yml','.github/scripts/test_candidate_upgrade.ps1')
          if ($LASTEXITCODE -ne 0 -or $changed.Count -ne 2 -or @($changed | Where-Object { $_ -notin $allowed }).Count -gt 0) {
            throw "Unexpected changes: $($changed -join ',')"
          }
          Write-Host 'Fixed #33 product source and test-only diff verified.'

      - name: Fetch fixed #33 candidate from successful native build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          repository: 159357yangjun/Mirror_Cloud
          run-id: 38119902170
          name: mirror-cloud-ux-native-candidate-installers
          github-token: \${{ github.token }}
          path: candidate

      - name: Verify old official release and candidate install compatibility
        shell: pwsh
        run: ./.github/scripts/test_candidate_upgrade.ps1

      - name: Preserve upgrade test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mirror-cloud-ux-upgrade-compat-evidence
          path: \${{ runner.temp }}/mirror-cloud-upgrade-compat/**
          if-no-files-found: warn
          retention-days: 14
