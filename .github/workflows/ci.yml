name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-check:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            website/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cache Rust dependencies and debug build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: ${{ runner.os }}-rust-debug-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml') }}
      - name: Static validation
        run: python scripts/validate.py
      - name: Command contract validation
        run: python scripts/check_contracts.py
      - name: User-flow contract validation
        run: python scripts/check_user_flow.py
      - name: Release version consistency validation
        run: python scripts/check_release_version.py
      - name: Tauri dependency family validation
        run: python scripts/check_tauri_dependency_family.py
      - name: Verify committed dependency locks
        shell: pwsh
        run: |
          $locks = @('Cargo.lock', 'apps/desktop/package-lock.json', 'website/package-lock.json')
          foreach ($lock in $locks) {
            if (-not (Test-Path $lock)) { throw "Missing committed dependency lock: $lock" }
          }
      - name: Rust format
        id: rustfmt
        shell: pwsh
        run: |
          cargo fmt --all
          git diff -- '*.rs' | Out-File -Encoding utf8 rustfmt.patch
          if ((Get-Item rustfmt.patch).Length -gt 3) {
            Write-Host 'rustfmt changed tracked Rust files. See the rustfmt-diff artifact.'
            git diff --check -- '*.rs'
            exit 1
          }
      - name: Upload rustfmt diff
        if: failure() && steps.rustfmt.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: rustfmt-diff
          path: rustfmt.patch
          if-no-files-found: error
          retention-days: 14
      - name: Rust check
        run: cargo check --workspace --locked
      - name: Rust tests
        run: cargo test --workspace --locked
      - name: Desktop build
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
      - name: Docs build
        working-directory: website
        run: |
          npm ci
          npm run build
      - name: Upload committed dependency locks
        uses: actions/upload-artifact@v7
        with:
          name: dependency-locks
          path: |
            Cargo.lock
            apps/desktop/package-lock.json
            website/package-lock.json
          if-no-files-found: error
          retention-days: 14
