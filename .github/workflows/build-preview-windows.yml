name: Build Windows Preview

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/build-preview-windows.yml'

permissions:
  contents: write

jobs:
  preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - name: Align complete Rust Tauri dependency family
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          path = Path('apps/desktop/src-tauri/Cargo.toml')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'tauri-build = { version = "2.5" }': 'tauri-build = { version = "=2.6.3" }',
              'tauri = { version = "2.11.5", features = ["tray-icon"] }': 'tauri = { version = "=2.11.5", features = ["tray-icon"] }',
              'tauri-plugin-dialog = "2"': 'tauri-plugin-dialog = "=2.7.3"',
              'tauri-plugin-opener = "2"': 'tauri-plugin-opener = "=2.5.5"',
              'tauri-plugin-clipboard-manager = "2.3.3"': 'tauri-plugin-clipboard-manager = "=2.3.3"',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected dependency declaration not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          '@ | python -

          $pins = @(
            @('tauri', '2.11.5'),
            @('tauri-runtime', '2.11.3'),
            @('tauri-runtime-wry', '2.11.4'),
            @('tauri-macros', '2.6.3'),
            @('tauri-build', '2.6.3'),
            @('tauri-codegen', '2.6.3'),
            @('tauri-utils', '2.9.3'),
            @('tauri-plugin-dialog', '2.7.3'),
            @('tauri-plugin-opener', '2.5.5'),
            @('tauri-plugin-clipboard-manager', '2.3.3')
          )
          foreach ($pin in $pins) {
            cargo update -p $pin[0] --precise $pin[1]
            if ($LASTEXITCODE -ne 0) { throw "failed to pin $($pin[0]) to $($pin[1])" }
          }

          Write-Host 'Resolved Tauri family:'
          cargo tree -p image-hosting-platform-desktop | Select-String 'tauri|wry|webview2-com|windows '

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build Windows preview bundles
        working-directory: apps/desktop
        run: npm run tauri build

      - name: Commit verified Tauri alignment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git add apps/desktop/src-tauri/Cargo.toml Cargo.lock
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff check failed' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: align Tauri Rust and JS dependency families'
          if ($LASTEXITCODE -ne 0) { throw 'git commit failed' }
          git pull --rebase origin dev
          if ($LASTEXITCODE -ne 0) { throw 'git pull --rebase failed; reconcile concurrent changes' }
          git push origin HEAD:dev
          if ($LASTEXITCODE -ne 0) { throw 'git push failed' }

      - name: Upload preview installers
        uses: actions/upload-artifact@v4
        with:
          name: image-hosting-platform-v1.4.0-preview-windows
          path: |
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.msi
          if-no-files-found: error
