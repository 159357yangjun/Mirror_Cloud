name: Release Bundle

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Validate source contracts
        run: |
          python scripts/validate.py
          python scripts/check_contracts.py
          python scripts/check_user_flow.py

      - name: Resolve and freeze dependency graph for this release run
        shell: pwsh
        run: |
          cargo generate-lockfile
          Push-Location apps/desktop
          npm install --package-lock-only --ignore-scripts
          Pop-Location
          Push-Location website
          npm install --package-lock-only --ignore-scripts
          Pop-Location

      - name: Validate locked Rust dependency graph
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --locked
          cargo test --workspace --locked

      - name: Install desktop dependencies from lock
        working-directory: apps/desktop
        run: npm ci

      - name: Build desktop frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Build Windows bundles
        working-directory: apps/desktop
        run: npm run tauri build

      - name: Stage release files and checksums
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE 'release'
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'target\release\bundle') -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.msi' } |
            ForEach-Object { Copy-Item $_.FullName -Destination $releaseDir }

          $sourceName = "image-hosting-platform-${{ github.ref_name }}-source.zip"
          git archive --format=zip -o (Join-Path $releaseDir $sourceName) HEAD
          if ($LASTEXITCODE -ne 0) { throw 'git archive failed' }

          $checksumPath = Join-Path $releaseDir 'SHA256SUMS.txt'
          Get-ChildItem $releaseDir -File |
            Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } | Set-Content -Encoding utf8 $checksumPath

      - name: Upload Windows release files
        uses: actions/upload-artifact@v4
        with:
          name: image-hosting-platform-release-files
          path: release/*
          if-no-files-found: error

      - name: Upload dependency locks used by this release
        uses: actions/upload-artifact@v4
        with:
          name: image-hosting-platform-dependency-locks
          path: |
            Cargo.lock
            apps/desktop/package-lock.json
            website/package-lock.json
          if-no-files-found: error

  docs-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve docs lock
        working-directory: website
        run: npm install --package-lock-only --ignore-scripts
      - name: Install docs dependencies from lock
        working-directory: website
        run: npm ci
      - name: Build static docs
        working-directory: website
        run: npm run build
      - name: Upload static docs
        uses: actions/upload-artifact@v4
        with:
          name: image-hosting-platform-docs
          path: website/dist/**
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - windows-bundle
      - docs-bundle
    runs-on: ubuntu-latest
    steps:
      - name: Download staged release files
        uses: actions/download-artifact@v4
        with:
          name: image-hosting-platform-release-files
          path: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Image Hosting Platform ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
          fail_on_unmatched_files: true
