name: Release Bundle

on:
  workflow_dispatch:
    inputs:
      sign_with_signpath:
        description: Submit this candidate to SignPath for manual approval and Authenticode signing
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: read
  attestations: write
  id-token: write
  artifact-metadata: write

jobs:
  windows-bundle:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      DOCS_BASE_URL: https://159357yangjun.github.io/Mirror_Cloud
      # Manual runs are test candidates; immutable tag builds keep the public version label only.
      MIRROR_CANDIDATE_SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}
      MIRROR_SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.sign_with_signpath) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-03
        with:
          toolchain: '1.98.1'
          components: rustfmt

      - name: Restore pinned debug build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: ${{ runner.os }}-rust-debug-v2-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml') }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Restore pinned native release build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: taskui-native-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml') }}

      - name: Validate update signing configuration
        env:
          MIRROR_UPDATE_SIGNING_SEED: ${{ secrets.MIRROR_UPDATE_SIGNING_SEED }}
        run: node scripts/sign_update.mjs --preflight

      - name: Validate SignPath signing configuration
        if: env.MIRROR_SIGNPATH_ENABLED == 'true'
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_APP_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_APP_ARTIFACT_CONFIGURATION_SLUG }}
          SIGNPATH_INSTALLERS_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_INSTALLERS_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          $required = @(
            'SIGNPATH_API_TOKEN',
            'SIGNPATH_ORGANIZATION_ID',
            'SIGNPATH_PROJECT_SLUG',
            'SIGNPATH_SIGNING_POLICY_SLUG',
            'SIGNPATH_APP_ARTIFACT_CONFIGURATION_SLUG',
            'SIGNPATH_INSTALLERS_ARTIFACT_CONFIGURATION_SLUG'
          )
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "SignPath is enabled but required secret/variable $name is not configured."
            }
          }

      - name: Resolve release version
        id: release-version
        shell: pwsh
        run: |
          $version = (Get-Content 'apps/desktop/package.json' -Raw | ConvertFrom-Json).version
          "version=$version" | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8NoBOM

      - name: Test update release signing
        run: node --test scripts/test_update_signing.mjs

      - name: Validate source contracts
        run: |
          python scripts/validate.py
          python scripts/check_contracts.py
          python scripts/check_user_flow.py
          python scripts/check_docs_site.py
          python scripts/check_workflow_action_pins.py
          python scripts/check_release_version.py
          python scripts/check_tauri_dependency_family.py

      - name: Resolve the docs base URL to bake into the bundle
        shell: pwsh
        run: |
          $candidate = $env:DOCS_BASE_URL
          $baked = 'VITE_DOCS_BASE_URL='
          if ([string]::IsNullOrWhiteSpace($candidate)) {
            Write-Host '::warning:: DOCS_BASE_URL is empty, so online tutorial links stay hidden in this bundle.'
            Add-Content -Path $env:GITHUB_ENV -Value $baked -Encoding utf8NoBOM
            exit 0
          }
          $probe = "$candidate/guides/github/"
          try {
            $code = [int](Invoke-WebRequest -Uri $probe -UseBasicParsing -TimeoutSec 30).StatusCode
          } catch {
            $code = 0
          }
          if ($code -eq 200) {
            Write-Host "docs reachable: HTTP $code $probe"
            Add-Content -Path $env:GITHUB_ENV -Value "$baked$candidate" -Encoding utf8NoBOM
          } else {
            Write-Host "::warning:: Docs at $probe are not published (HTTP $code), so this bundle hides the online tutorial links instead of shipping dead ones. Enable GitHub Pages (Settings -> Pages -> Source: GitHub Actions) and run the Docs Site workflow to include them."
            Add-Content -Path $env:GITHUB_ENV -Value $baked -Encoding utf8NoBOM
          }

      - name: Verify committed dependency locks
        shell: pwsh
        run: |
          $locks = @('Cargo.lock', 'apps/desktop/package-lock.json', 'website/package-lock.json')
          foreach ($lock in $locks) {
            if (-not (Test-Path $lock)) { throw "Missing committed dependency lock: $lock" }
          }

      - name: Validate locked Rust dependency graph
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --locked
          cargo test --workspace --locked

      - name: Install desktop dependencies from lock
        working-directory: apps/desktop
        run: npm ci

      - name: Build desktop frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Build unsigned app executable for SignPath
        if: env.MIRROR_SIGNPATH_ENABLED == 'true'
        working-directory: apps/desktop
        run: npm run tauri build -- --no-bundle

      - name: Build Windows bundles without Authenticode signing
        if: env.MIRROR_SIGNPATH_ENABLED != 'true'
        working-directory: apps/desktop
        run: npm run tauri build

      - name: Upload unsigned application executable to GitHub Actions
        id: upload-unsigned-app
        if: env.MIRROR_SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mirror-cloud-app-exe-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/release/image-hosting-platform-desktop.exe
          if-no-files-found: error
          retention-days: 1

      - name: Submit app executable for SignPath signing
        id: sign-app-executable
        if: env.MIRROR_SIGNPATH_ENABLED == 'true'
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_APP_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-app.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ runner.temp }}\mirror-cloud-signed-app
          parameters: |
            version: "${{ steps.release-version.outputs.version }}"

      - name: Verify signed app executable and replace build output
        if: env.MIRROR_SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          $signedRoot = Join-Path $env:RUNNER_TEMP 'mirror-cloud-signed-app'
          $signedFiles = @(Get-ChildItem -LiteralPath $signedRoot -Recurse -File -Filter 'image-hosting-platform-desktop.exe')
          if ($signedFiles.Count -ne 1) { throw "Expected one SignPath-signed app executable, found $($signedFiles.Count)." }
          $signature = Get-AuthenticodeSignature -LiteralPath $signedFiles[0].FullName
          if ($signature.Status -ne 'Valid') { throw "Application Authenticode signature is not valid: $($signature.Status)." }
          if ($signature.SignerCertificate.Subject -notmatch 'SignPath Foundation') { throw "Unexpected application signer: $($signature.SignerCertificate.Subject)." }
          Copy-Item -LiteralPath $signedFiles[0].FullName -Destination 'target/release/image-hosting-platform-desktop.exe' -Force

      - name: Build Windows bundles from the signed application executable
        if: env.MIRROR_SIGNPATH_ENABLED == 'true'
        working-directory: apps/desktop
        run: npm run tauri bundle -- --bundles nsis,msi

      - name: Stage installer signing inputs
        if: env.MIRROR_SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          $bundleRoot = Join-Path $env:GITHUB_WORKSPACE 'target\release\bundle'
          $exeFiles = @(Get-ChildItem $bundleRoot -Recurse -File -Filter '*.exe')
          $msiFiles = @(Get-ChildItem $bundleRoot -Recurse -File -Filter '*.msi')
          if ($exeFiles.Count -ne 1) { throw "Expected exactly one Windows EXE installer, found $($exeFiles.Count)." }
          if ($msiFiles.Count -ne 1) { throw "Expected exactly one Windows MSI installer, found $($msiFiles.Count)." }
          $inputDir = Join-Path $env:RUNNER_TEMP 'mirror-cloud-installer-signing-input'
          New-Item -ItemType Directory -Force -Path $inputDir | Out-Null
          Copy-Item -LiteralPath $exeFiles[0].FullName -Destination $inputDir
          Copy-Item -LiteralPath $msiFiles[0].FullName -Destination $inputDir

      - name: Upload unsigned installers to GitHub Actions
        id: upload-unsigned-installers
        if: env.MIRROR_SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mirror-cloud-installers-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mirror-cloud-installer-signing-input/*
          if-no-files-found: error
          retention-days: 1

      - name: Submit installers for SignPath signing
        id: sign-installers
        if: env.MIRROR_SIGNPATH_ENABLED == 'true'
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLERS_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-installers.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ runner.temp }}\mirror-cloud-signed-installers

      - name: Verify signed installers and update bundle outputs
        if: env.MIRROR_SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          $signedRoot = Join-Path $env:RUNNER_TEMP 'mirror-cloud-signed-installers'
          $signedExe = @(Get-ChildItem -LiteralPath $signedRoot -Recurse -File -Filter '*.exe')
          $signedMsi = @(Get-ChildItem -LiteralPath $signedRoot -Recurse -File -Filter '*.msi')
          if ($signedExe.Count -ne 1 -or $signedMsi.Count -ne 1) { throw "Expected one signed EXE and MSI, found $($signedExe.Count) and $($signedMsi.Count)." }
          foreach ($file in @($signedExe[0], $signedMsi[0])) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'Valid') { throw "Installer Authenticode signature is not valid for $($file.Name): $($signature.Status)." }
            if ($signature.SignerCertificate.Subject -notmatch 'SignPath Foundation') { throw "Unexpected installer signer for $($file.Name): $($signature.SignerCertificate.Subject)." }
          }
          $bundleRoot = Join-Path $env:GITHUB_WORKSPACE 'target\release\bundle'
          foreach ($file in @($signedExe[0], $signedMsi[0])) {
            $matches = @(Get-ChildItem $bundleRoot -Recurse -File -Filter $file.Name)
            if ($matches.Count -ne 1) { throw "Expected one unsigned bundle destination for $($file.Name), found $($matches.Count)." }
            Copy-Item -LiteralPath $file.FullName -Destination $matches[0].FullName -Force
          }

      - name: Verify build did not mutate dependency locks
        shell: pwsh
        run: |
          git diff --exit-code -- Cargo.lock apps/desktop/package-lock.json website/package-lock.json
          if ($LASTEXITCODE -ne 0) {
            throw 'Release build modified a committed dependency lock. Update dependencies explicitly before releasing.'
          }

      - name: Smoke-test NSIS and MSI installers
        id: installer-smoke
        shell: pwsh
        run: ./scripts/smoke_windows_installers.ps1

      - name: Upload installer smoke logs on failure
        if: failure() && steps.installer-smoke.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer-smoke-logs
          path: ${{ runner.temp }}/image-hosting-platform-installer-smoke/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Stage release files and checksums
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE 'release'
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          $version = (Get-Content (Join-Path $env:GITHUB_WORKSPACE 'apps\desktop\package.json') -Raw | ConvertFrom-Json).version
          $bundleRoot = Join-Path $env:GITHUB_WORKSPACE 'target\release\bundle'
          $exeFiles = @(Get-ChildItem $bundleRoot -Recurse -File -Filter '*.exe')
          $msiFiles = @(Get-ChildItem $bundleRoot -Recurse -File -Filter '*.msi')
          if ($exeFiles.Count -ne 1) { throw "Expected exactly one Windows EXE installer, found $($exeFiles.Count)." }
          if ($msiFiles.Count -ne 1) { throw "Expected exactly one Windows MSI installer, found $($msiFiles.Count)." }

          $exeName = "image-hosting-platform-v$version-windows-x64-setup.exe"
          $msiName = "image-hosting-platform-v$version-windows-x64.msi"
          Copy-Item $exeFiles[0].FullName -Destination (Join-Path $releaseDir $exeName)
          Copy-Item $msiFiles[0].FullName -Destination (Join-Path $releaseDir $msiName)

          $sourceName = "image-hosting-platform-v$version-source.zip"
          git archive --format=zip -o (Join-Path $releaseDir $sourceName) HEAD
          if ($LASTEXITCODE -ne 0) { throw 'git archive failed' }

          $checksumPath = Join-Path $releaseDir 'SHA256SUMS.txt'
          Get-ChildItem $releaseDir -File |
            Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } | Set-Content -Encoding utf8 $checksumPath

      - name: Sign update manifest and verify staged installer
        env:
          MIRROR_UPDATE_SIGNING_SEED: ${{ secrets.MIRROR_UPDATE_SIGNING_SEED }}
        run: |
          node scripts/sign_update.mjs release
          node scripts/sign_update.mjs --verify release

      - name: Attest final release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*

      - name: Upload Windows release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-hosting-platform-release-files
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload dependency locks used by this release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-hosting-platform-dependency-locks
          path: |
            Cargo.lock
            apps/desktop/package-lock.json
            website/package-lock.json
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - windows-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download staged release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-hosting-platform-release-files
          path: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Mirror Cloud ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            **Code signing policy:** [current signing status and policy](https://159357yangjun.github.io/Mirror_Cloud/use/signing/)

            **Privacy and data handling:** [privacy policy](https://159357yangjun.github.io/Mirror_Cloud/use/privacy/)
          files: release/*
          fail_on_unmatched_files: true
