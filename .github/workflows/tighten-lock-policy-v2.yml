name: Tighten Lock Policy V2

on:
  push:
    branches:
      - dev
    paths:
      - 'scripts/tighten_lock_policy.py'
      - '.github/workflows/tighten-lock-policy-v2.yml'

permissions:
  contents: write

jobs:
  tighten-lock-policy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable

      - name: Patch lock policy
        run: python scripts/tighten_lock_policy.py

      - name: Validate patched repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/validate.py
          python scripts/check_contracts.py
          python scripts/check_user_flow.py
          cargo check --workspace --locked
          Push-Location apps/desktop
          npm ci --ignore-scripts
          npm run build
          Pop-Location
          Push-Location website
          npm ci --ignore-scripts
          npm run build
          Pop-Location

      - name: Remove bootstrap helpers
        shell: pwsh
        run: |
          git rm --ignore-unmatch .github/workflows/commit-lockfiles.yml
          git rm --ignore-unmatch .github/workflows/tighten-lock-policy.yml
          git rm --ignore-unmatch .github/workflows/tighten-lock-policy-v2.yml
          git rm --ignore-unmatch scripts/tighten_lock_policy.py
          git diff --check

      - name: Commit policy transition
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'build: consume committed dependency locks'
          if ($LASTEXITCODE -ne 0) { throw 'git commit failed' }
          git pull --rebase origin dev
          if ($LASTEXITCODE -ne 0) { throw 'git pull --rebase failed; concurrent changes require reconciliation' }
          git push origin HEAD:dev
          if ($LASTEXITCODE -ne 0) { throw 'git push failed' }
