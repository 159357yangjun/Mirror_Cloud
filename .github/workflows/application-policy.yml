name: Application publish policy

on:
  push:
    branches: [main]
    paths:
      - 'crates/application/**'
      - 'crates/domain/**'
      - 'crates/storage-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/application-policy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Check Rust format
        run: cargo fmt --all -- --check
      - name: Test shared publish policy without remote I/O
        run: cargo test -p application --locked
