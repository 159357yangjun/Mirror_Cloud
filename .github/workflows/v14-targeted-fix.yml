name: One-time v1.4 Targeted Fix

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/v14-targeted-fix.yml'

permissions:
  contents: write

jobs:
  patch-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact guarded replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          contract_path = Path('scripts/check_user_flow.py')
          contract = contract_path.read_text(encoding='utf-8')
          if 'import re\n' not in contract[:80]:
              contract = replace_once(contract, 'from pathlib import Path\n', 'from pathlib import Path\nimport re\n', 'add regex import')
          contract = replace_once(
              contract,
              "require('enabled:false' in commands, 'marketplace plugins install disabled')",
              "require(re.search(r'enabled\\s*:\\s*false', commands) is not None, 'marketplace plugins install disabled')",
              'marketplace enabled check',
          )
          contract = replace_once(
              contract,
              "require('AI_CREDENTIAL_KEY' in commands and 'credentials.set_json(AI_CREDENTIAL_KEY' in commands, 'AI API key uses credential store')",
              "require('AI_CREDENTIAL_KEY' in commands and re.search(r'credentials\\s*\\.\\s*set_json\\(\\s*AI_CREDENTIAL_KEY', commands) is not None, 'AI API key uses credential store')",
              'AI credential check',
          )
          contract = replace_once(
              contract,
              "require('execute_for_hook(&manifest, &granted_permissions' in cli, 'Typora plugin runtime uses persisted user grants')",
              "require(re.search(r'execute_for_hook\\(\\s*&manifest,\\s*&granted_permissions', cli) is not None, 'Typora plugin runtime uses persisted user grants')",
              'Typora granted permissions check',
          )
          contract = replace_once(
              contract,
              "require('API Key 不能写入插件 JSON' in commands and 'config.get(\"apiKey\")' in commands, 'generic plugin JSON cannot persist AI API keys')",
              "require('API Key 不能写入插件 JSON' in commands and re.search(r'config\\s*\\.\\s*get\\(\\s*\"apiKey\"\\s*\\)', commands) is not None, 'generic plugin JSON cannot persist AI API keys')",
              'generic plugin API key check',
          )
          contract = replace_once(
              contract,
              "require('record_execution(&manifest.id' in commands_main and 'record_execution(&manifest.id' in cli, 'desktop and Typora/Local API plugin lifecycle executions are audited')",
              "require(re.search(r'record_execution\\(\\s*&manifest\\.id', commands_main) is not None and re.search(r'record_execution\\(\\s*&manifest\\.id', cli) is not None, 'desktop and Typora/Local API plugin lifecycle executions are audited')",
              'plugin lifecycle audit check',
          )
          contract = replace_once(
              contract,
              "require('manual_trigger\",\"success\"' in plugin_commands and 'manual_trigger\",\"failed\"' in plugin_commands, 'manual plugin runs are audited')",
              "require(re.search(r'\"manual_trigger\"\\s*,\\s*\"success\"', plugin_commands) is not None and re.search(r'\"manual_trigger\"\\s*,\\s*\"failed\"', plugin_commands) is not None, 'manual plugin runs are audited')",
              'manual plugin audit check',
          )
          contract_path.write_text(contract, encoding='utf-8', newline='\n')

          settings_path = Path('apps/desktop/src/pages/SettingsPage.tsx')
          settings = settings_path.read_text(encoding='utf-8')
          settings = replace_once(
              settings,
              "{startingTypora ? <LoaderCircle size={14} className=\"animate-spin\" /> : <Sparkles size={14} />}一键开始配置",
              "{startingTypora ? <LoaderCircle size={14} className=\"animate-spin\" /> : <Sparkles size={14} />}复制命令并打开 Typora",
              'Typora primary button',
          )
          settings = replace_once(
              settings,
              '“一键开始配置”会先把 Custom Command 放进剪贴板，再启动 Typora；随后只需在 Typora 的图像设置里粘贴并执行一次验证。',
              '“复制命令并打开 Typora”只会把 Custom Command 放进剪贴板并启动 Typora，不会自动修改 Typora 设置。请继续在 Typora → 偏好设置 → 图像中手动选择“自定义命令”、粘贴并执行一次验证。',
              'Typora behavior explanation',
          )
          settings = replace_once(
              settings,
              '点击“一键开始配置”（命令已复制并打开 Typora）',
              '点击“复制命令并打开 Typora”（命令会复制到剪贴板）',
              'Typora first step',
          )
          settings = settings.replace('Publisher 自动维护的上传链', '图床自动维护的上传链')
          settings = settings.replace('Publisher 默认上传链', '图床默认上传链')
          settings = settings.replace('Publisher GUI 不需要保持打开', '图床界面不需要保持打开')
          settings_path.write_text(settings, encoding='utf-8', newline='\n')
          PY
      - name: Verify target checks locally
        run: python scripts/check_user_flow.py
      - name: Commit targeted changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/check_user_flow.py apps/desktop/src/pages/SettingsPage.tsx
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix: make contracts rustfmt-safe and clarify Typora setup'
          git push origin HEAD:dev
